name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies for critical advisories
        run: npm audit --audit-level=critical

      # Tailwind 3 still pulls in build-only packages with unpatched advisories.
      # Report them until a Tailwind 4 migration can be tested visually.
      - name: Report build dependency advisories
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Build app
        run: npm run build

      - name: Build self-play runner
        run: npm run selfplay:build

      - name: Build hybrid trainer
        run: npm run hybrid:build
